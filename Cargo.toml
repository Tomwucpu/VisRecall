[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/library",
  "crates/capture",
  "crates/shell",
  "crates/app-core",
  "crates/ai",
  "crates/search",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
proptest = "1"

# --- 阶段 03 新增（锁定于 Cargo.lock；升级前跑完整测试） ---
async-trait = "0.1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jieba-rs = "0.11"
keyring = { version = "3", features = ["windows-native"] }
lru = "0.12"
ndarray = "0.17"
ort = { version = "2.0.0-rc.15", default-features = false, features = [
  "std",
  "ndarray",
  "tracing",
  "load-dynamic",
  "api-31",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
wiremock = "0.6"
