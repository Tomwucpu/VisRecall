[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/library",
  "crates/capture",
  "crates/shell",
  "crates/app-core",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
proptest = "1"
