<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>目记 VisRecall</title>
    <!--
      首帧样式全部内联：WebView2 拿到这份 HTML 的第一帧就按当前主题铺底色。
      React 包与 globals.css 都是「JS 到达之后」才生效的，在此之前不铺底色
      就会露出 WebView2 的默认白底 —— 这就是启动白屏的直接来源。
      颜色取自 src/styles/tokens.css 的 --bg，改令牌时同步这里。
    -->
    <script>
      // 先按持久化的偏好定型，避免「系统深色 + 用户选浅色」时先闪一下深色。
      try {
        var saved = localStorage.getItem("visrecall.theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (error) {
        /* 存储不可用时保持跟随系统 */
      }
    </script>
    <style>
      html {
        background: #eceae4;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        background: #0f0f0f;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background: #0f0f0f;
          color-scheme: dark;
        }
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      /* React 挂载后 #root 的内容会被整体替换，这段只在加载期可见。 */
      .boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #93938b;
      }
      .boot-mark {
        width: 22px;
        height: 22px;
        border: 1px solid rgba(21, 21, 20, 0.17);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
        color: #151514;
      }
      .boot-text {
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.09em;
      }
      html[data-theme="dark"] .boot {
        color: #7d7d77;
      }
      html[data-theme="dark"] .boot-mark {
        border-color: rgba(255, 255, 255, 0.16);
        color: #f2f2ee;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) .boot {
          color: #7d7d77;
        }
        html:not([data-theme="light"]) .boot-mark {
          border-color: rgba(255, 255, 255, 0.16);
          color: #f2f2ee;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark">目</div>
        <div class="boot-text">正在加载</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
