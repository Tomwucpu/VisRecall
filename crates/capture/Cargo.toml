[package]
name = "visrecall-capture"
version.workspace = true
edition.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = { workspace = true }
visrecall-domain = { version = "0.1.0", path = "../domain" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
