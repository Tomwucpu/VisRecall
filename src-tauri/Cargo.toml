[package]
name = "visrecall"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "specta"] }
visrecall-app-core = { path = "../crates/app-core" }
visrecall-capture = { path = "../crates/capture" }
visrecall-domain = { path = "../crates/domain" }
serde.workspace = true
specta-typescript = "=0.0.13"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2.7.2"
# 目录选择器：只在 Rust 侧调用，前端不直接依赖插件（P2-R09 / Task 14）。
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing = { workspace = true }
# 与 tauri 使用同一份 windows crate（0.62），`ShowWindow(hwnd, SW_SHOWNOACTIVATE)`
# 才能在 tauri 的 `HWND` 上直接调用（主窗口恢复不能抢焦点）。
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# 仅测试用：断言 DTO 的 JSON 键名（例如标签 chip 的 `auto`）；复用工作区已锁版本。
serde_json.workspace = true

[features]
# release 必须内嵌前端资源：`tauri` 的 `custom-protocol` 不在默认 features 里，
# 缺了它 release 构建不会把 `dist/` 打进去，窗口会去连 devUrl 或直接空白。
# 默认开启，`cargo build --release -p visrecall` 一条命令即可产出可运行的二进制。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
